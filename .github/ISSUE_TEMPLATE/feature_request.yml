name: Feature request
description: Suggest a capability or improvement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation you are in, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including workarounds you are using today.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI command or flag
        - Component wrapper
        - Theming and tokens
        - Community registries
        - Documentation
        - Other
    validations:
      required: true
