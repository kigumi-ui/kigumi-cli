name: Bug report
description: Something in the CLI or a generated component does not work as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The more precisely we can reproduce the problem,
        the faster it gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order.
      placeholder: |
        1. npx kigumi init
        2. npx kigumi add button
        3. ...
      render: shell
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - React
        - Vue
        - Angular
        - Next.js
        - Not framework specific
    validations:
      required: true

  - type: input
    id: kigumi-version
    attributes:
      label: Kigumi version
      description: Output of `npx kigumi --version`
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: kigumi.config.json
      description: Your project config, with anything sensitive removed.
      render: json

  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Any error message or stack trace, as text rather than a screenshot.
      render: shell
