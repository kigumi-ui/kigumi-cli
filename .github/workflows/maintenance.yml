name: Maintenance

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 6am UTC
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=critical

      - name: Check for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency licenses
        run: |
          pnpm licenses list --prod --json > licenses.json
          # Fail if any non-permissive licenses found
          node -e "
            const data = JSON.parse(require('fs').readFileSync('licenses.json', 'utf-8'));
            const allowed = ['MIT', 'ISC', 'BSD-2-Clause', 'BSD-3-Clause', 'Apache-2.0', '0BSD', 'BlueOak-1.0.0', 'CC0-1.0', 'Unlicense', 'Python-2.0'];
            const issues = [];
            for (const [license, packages] of Object.entries(data)) {
              if (!allowed.includes(license)) {
                for (const pkg of packages) {
                  issues.push(pkg.name + '@' + pkg.version + ' (' + license + ')');
                }
              }
            }
            if (issues.length > 0) {
              console.error('Non-permissive licenses found:');
              issues.forEach(i => console.error('  - ' + i));
              process.exit(1);
            }
            console.log('All ' + Object.values(data).flat().length + ' production dependencies have permissive licenses');
          "

  test-compat:
    name: Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  validate-all:
    name: Validate All
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block rather than
    # merging with it, so contents: read has to be restated or checkout
    # breaks. See #173 for the regression; validate:gha-permissions guards it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All 15 validators already run in CI, but only when a pull request
      # touches a file. This is the same suite on a clock, so drift caused by
      # the outside world moving is visible without anyone editing anything.
      - name: Run all validators
        run: pnpm validate:all

  external-links:
    name: External Link Report
    runs-on: ubuntu-latest
    # Opens an issue, so it needs issues: write alongside a restated
    # contents: read.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reports, never fails: the script always exits 0 so that a third-party
      # server having a bad day cannot turn this repo red.
      - name: Check external links
        id: links
        # The report is pasted into an issue for a human to read, so keep ANSI
        # escapes out of it. Runners set FORCE_COLOR, which overrides the
        # library's own TTY detection, so NO_COLOR has to be explicit.
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: pnpm --silent check:external-links | tee link-report.txt

      - name: Report dead links
        if: steps.links.outputs.failures != '0' && steps.links.outputs.failures != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label upstream-report --state open --search "External links in head:" \
            --json number --jq '.[0].number // empty')
          BODY=$(printf 'The weekly external link check found links that did not respond.\n\n```\n%s\n```\n\nReported by `.github/workflows/maintenance.yml`. Checked weekly; nothing is failing because of this.\n' "$(cat link-report.txt)")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "External links in README.md or NOTICE stopped responding" \
              --body "$BODY" \
              --label upstream-report
          fi

  upstream-versions:
    name: Upstream Version Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Web Awesome is excluded from Dependabot on purpose, because a bump
      # there touches registry, templates, docs and fixtures at once. This
      # only reports that a release exists; the upgrade stays a decision.
      - name: Compare pinned versions against the registry
        id: versions
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: pnpm --silent check:upstream-versions | tee version-report.txt

      - name: Report version drift
        if: steps.versions.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label upstream-report --state open --search "Upstream versions in head:" \
            --json number --jq '.[0].number // empty')
          BODY=$(printf 'The weekly upstream check found newer published versions.\n\n```\n%s\n```\n\nReported by `.github/workflows/maintenance.yml`. Upgrading is a decision, not an automatic action.\n' "$(cat version-report.txt)")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Upstream versions moved ahead of the pins" \
              --body "$BODY" \
              --label upstream-report
          fi
