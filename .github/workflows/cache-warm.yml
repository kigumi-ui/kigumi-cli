name: Cache Warm

# Populates the Playwright browser cache on the default branch.
#
# GitHub scopes a cache written on a PR branch to that PR's ref, and only
# caches on the default branch are visible to other branches. CI triggers
# solely on `pull_request`, so every Playwright save landed on
# refs/pull/<n>/merge and no PR could ever read one: "Cache not found for
# input keys" on every observed run, while the 249 MB browser download
# repeated each time and the unreadable entries accumulated.
#
# This workflow exists to write that one entry on refs/heads/main. It runs
# nothing else, because the point is the cache save, not the test.
#
# The key must stay in lockstep with the "Cache Playwright browsers" step in
# ci.yml. A key that drifts here silently returns CI to a cold download,
# which looks exactly like this workflow not existing at all.

on:
  push:
    branches: [main]
    paths:
      # The key is derived from this file, so only a change to it can
      # invalidate the entry the PR lane looks for.
      - 'docs/pnpm-lock.yaml'
      - '.github/workflows/cache-warm.yml'
  workflow_dispatch:

permissions:
  contents: read
  # The organization copy of Web Awesome Pro on GitHub Packages.
  packages: read

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  playwright:
    name: Warm Playwright cache
    # Pinned: Playwright 1.58 has no Chromium build for Ubuntu 26.04, which
    # ubuntu-latest now resolves to. Lift with a Playwright bump that supports it.
    # ci.yml's story-interactions job must run on the same image (validate:cache-keys).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # A push to main can read the organization copy of Web Awesome Pro.
      # When it cannot, the package's Actions access is missing, and the
      # run fails instead of leaving the PR lane without a warm cache.
      - name: Probe the Web Awesome Pro package
        id: probe
        continue-on-error: true
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/setup-npmrc.mjs --probe

      # Unreadable is a skip only where it is expected: a fork or Dependabot
      # pull request. Anywhere else the access is broken, and skipping would
      # report a pass that verified nothing (docs/adr/0003).
      - name: Check Pro registry access
        id: pro
        env:
          PROBED: ${{ steps.probe.outcome }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$PROBED" = "success" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ] && { [ "$HEAD_REPO" != "$REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; }; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cache warm NOT run: a fork or Dependabot pull request cannot read the Web Awesome Pro package."
          else
            echo "::error::The Web Awesome Pro package is not readable on a run that should read it. Check the package settings: Manage Actions access must list this repository with Read."
            exit 1
          fi

      - name: Install docs dependencies
        if: steps.pro.outputs.available == 'true'
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # Key and path must match ci.yml's "Cache Playwright browsers" step
      # exactly, or the entry written here is not the one that lane looks up.
      - name: Cache Playwright browsers
        id: cache
        if: steps.pro.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-

      # Only download when the exact key is absent. A restore-keys hit still
      # leaves cache-hit false, and re-downloading then would not save a new
      # entry under the exact key, so the miss would repeat forever.
      - name: Install Playwright Chromium
        if: steps.pro.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
        working-directory: docs
        # No --with-deps, matching ci.yml: it shells out to apt against
        # Google's Debian mirror and dies when that mirror serves a bad index.
        run: pnpm exec playwright install chromium
