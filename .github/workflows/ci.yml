name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      chromatic-skip:
        description: 'Skip Chromatic snapshots (baseline only)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Validate Registry
        run: pnpm run validate:registry

      - name: Validate Templates
        run: pnpm run validate:templates

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Build
        run: pnpm run build

  integration:
    name: Integration Tests (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: ['18', '19']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: Integration tests
        run: pnpm run test:integration
        env:
          REACT_VERSION: ${{ matrix.react-version }}

  chromatic:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: docs-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - 'docs/**'

      - name: Setup pnpm
        if: steps.docs-filter.outputs.docs == 'true' || inputs.chromatic-skip == true
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.docs-filter.outputs.docs == 'true' || inputs.chromatic-skip == true
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pro registry for docs
        if: steps.docs-filter.outputs.docs == 'true' && inputs.chromatic-skip != true
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        if: steps.docs-filter.outputs.docs == 'true' || inputs.chromatic-skip == true
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        if: steps.docs-filter.outputs.docs == 'true' && inputs.chromatic-skip != true
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        if: steps.docs-filter.outputs.docs == 'true' && inputs.chromatic-skip != true
        working-directory: docs
        run: pnpm build-storybook

      - name: Run Chromatic
        if: steps.docs-filter.outputs.docs == 'true' || inputs.chromatic-skip == true
        uses: chromaui/action@latest
        with:
          workingDir: docs
          storybookBuildDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          skip: ${{ inputs.chromatic-skip == true }}
