name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      src: ${{ steps.filter.outputs.src }}
      templates: ${{ steps.filter.outputs.templates }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
      starters: ${{ steps.filter.outputs.starters }}
      story: ${{ steps.filter.outputs.story }}
      deps: ${{ steps.filter.outputs.deps }}
      integration_matrix: ${{ steps.matrix.outputs.integration }}
      starter_matrix: ${{ steps.matrix.outputs.starter }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
            docs:
              - 'docs/**'
            src:
              - 'src/**'
            templates:
              - 'templates/**'
            integration:
              - 'tests/integration/**'
            e2e:
              - 'tests/e2e/**'
            starters:
              - 'tests/fixtures/starter-snapshots/**'
              - 'tests/e2e/starter-snapshots.test.ts'
            story:
              - 'docs/src/stories/**'
              - 'docs/src/components/**'
              - 'docs/.storybook/**'

      # Compute matrix sizes for Integration and Starter jobs.
      # Full coverage (all 4 frameworks) only when:
      #   * `full-ci` label is on the PR, OR
      #   * branch is the changesets bot's `changeset-release/main` (pre-release gate), OR
      #   * (starter only) templates or deps changed.
      # Otherwise: drop react@18 from Integration; reduce Starter matrix to react only.
      # Rationale: react@18-vs-19 differences are JSX-typing only and well-bounded;
      # starter coverage for non-react frameworks is high-value only when templates
      # or deps change. Bugs missed on a regular PR get caught at the next release PR
      # (full-ci auto-fires on changeset-release/main) before publish.
      - id: matrix
        env:
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          HEAD_REF: ${{ github.head_ref }}
          TEMPLATES: ${{ steps.filter.outputs.templates }}
          DEPS: ${{ steps.filter.outputs.deps }}
        run: |
          set -euo pipefail
          if [ "$FULL_CI_LABEL" = "true" ] || [ "$HEAD_REF" = "changeset-release/main" ]; then
            FULL=true
          else
            FULL=false
          fi
          if [ "$TEMPLATES" = "true" ] || [ "$DEPS" = "true" ]; then
            HEAVY=true
          else
            HEAVY=false
          fi

          if [ "$FULL" = "true" ]; then
            INTEGRATION='[{"framework":"react","version":"18"},{"framework":"react","version":"19"},{"framework":"vue","version":"3"},{"framework":"angular","version":"latest"}]'
          else
            INTEGRATION='[{"framework":"react","version":"19"},{"framework":"vue","version":"3"},{"framework":"angular","version":"latest"}]'
          fi

          if [ "$FULL" = "true" ] || [ "$HEAVY" = "true" ]; then
            STARTERS='[{"framework":"react","framework_upper":"REACT","repo":"kigumi-ui/kigumi-react-starter"},{"framework":"vue","framework_upper":"VUE","repo":"kigumi-ui/kigumi-vue-starter"},{"framework":"angular","framework_upper":"ANGULAR","repo":"kigumi-ui/kigumi-angular-starter"},{"framework":"next","framework_upper":"NEXT","repo":"kigumi-ui/kigumi-next-starter"}]'
          else
            STARTERS='[{"framework":"react","framework_upper":"REACT","repo":"kigumi-ui/kigumi-react-starter"}]'
          fi

          echo "integration=$INTEGRATION" >> "$GITHUB_OUTPUT"
          echo "starter=$STARTERS" >> "$GITHUB_OUTPUT"
          echo "Integration matrix ($([ "$FULL" = "true" ] && echo full || echo reduced)): $INTEGRATION"
          echo "Starter matrix ($([ "$FULL" = "true" ] || [ "$HEAVY" = "true" ] && echo full || echo reduced)): $STARTERS"

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: TypeScript strict check
        run: pnpm run type-check

      - name: Check mock budget
        env:
          MOCK_BUDGET_ENFORCE: '1'
        run: pnpm run check:mocks

      - name: Validate Registry
        run: pnpm run validate:registry

      - name: Validate Templates
        run: pnpm run validate:templates

      - name: Validate Changesets
        run: pnpm run validate:changesets

      - name: Validate generated-artifact freshness
        # Checks B/C/D (docs-wrapper CSS, .jsx subset, starter fixtures) run here.
        # Check A (generator regen) self-skips: no Web Awesome CEM / Pro token in
        # this job, so metadata/template freshness stays covered by prebuild,
        # check-metadata-freshness, and validate:cem-sync instead.
        run: pnpm run validate:generated-fresh

      - name: Validate Changes
        run: pnpm run validate:changes

      - name: Validate Stories
        run: pnpm run validate:stories

      - name: Validate Parity
        run: pnpm run validate:parity

      - name: Validate AGENTS.md
        run: pnpm run validate:agents

      - name: Validate CEM Sync
        # Runs unauthenticated on purpose. The component-presence half reads the
        # committed COMPONENT_METADATA and always applies; only the prop-value
        # drift half needs the Pro CEM, and it self-skips when that is absent
        # (validate-cem-sync.ts). Gating this step on WEBAWESOME_NPM_TOKEN would
        # mean installing docs dependencies here for no additional coverage.
        run: pnpm run validate:cem-sync

      - name: Validate Web Awesome pins
        # The WA version lives in six places (both package.json files, both
        # kigumi.config.json files, DEFAULT_WEBAWESOME_VERSION, and the newest
        # VERSION_MAP entry). A bump that misses one ships silently, and a
        # missed VERSION_MAP entry makes `kigumi upgrade` install an older WA
        # than the CLI targets.
        run: pnpm run validate:wa-pins

      - name: Validate GHA job permissions
        # A job-level `permissions:` block REPLACES the workflow-level one
        # instead of merging, so a job that declares any permissions silently
        # drops every scope it does not restate. Dropping `contents: read`
        # breaks actions/checkout, which is how PR #173 regressed.
        run: pnpm run validate:gha-permissions

      - name: Validate story interaction lanes
        # The lane's story subset is shared by .storybook-test/main.ts and
        # vitest.storybook.config.ts. This checks it against the stories
        # actually tagged `interaction`, so a new tagged story cannot be
        # silently left out of the lane.
        run: pnpm run validate:story-lanes

      - name: Validate fixture exclusions
        # Starter snapshots are recorded CLI output. Prettier, ESLint and tsc
        # must all skip them, in three separate ignore lists; dropping any one
        # is silent until a formatter rewrites a fixture.
        run: pnpm run validate:fixture-exclusions

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Build
        run: pnpm run build

  integration:
    name: Integration Tests (${{ matrix.framework }}@${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true'
      || needs.changes.outputs.templates == 'true'
      || needs.changes.outputs.integration == 'true'
      || needs.changes.outputs.deps == 'true'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || github.head_ref == 'changeset-release/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.integration_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: Integration tests
        run: pnpm run test:integration
        env:
          REACT_VERSION: ${{ matrix.framework == 'react' && matrix.version || '18' }}
          KIGUMI_MATRIX_FRAMEWORK: ${{ matrix.framework }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true'
      || needs.changes.outputs.templates == 'true'
      || needs.changes.outputs.e2e == 'true'
      || needs.changes.outputs.deps == 'true'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || github.head_ref == 'changeset-release/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: E2E tests
        run: pnpm run test:e2e

  pack-test:
    name: Pack Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack and smoke install
        run: |
          set -euo pipefail
          TARBALL=$(pnpm pack | tail -1)
          echo "Built tarball: ${TARBALL}"
          SMOKE_DIR="${RUNNER_TEMP}/kigumi-pack-test"
          mkdir -p "${SMOKE_DIR}/src"
          cd "${SMOKE_DIR}"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "file:${GITHUB_WORKSPACE}/${TARBALL}"
          # Explicit --components-dir pins the assertion path independent of
          # kigumi's sourceLayout detection (which requires more than just an
          # empty src/ dir to default to src/components/ui).
          npx --no-install kigumi init --framework react --typescript --yes --no-install --components-dir src/components/ui
          npx --no-install kigumi add button --yes
          test -f src/components/ui/Button/Button.tsx \
            || (echo "ERROR: Button wrapper missing at src/components/ui/Button/Button.tsx"; ls -R src 2>/dev/null || true; exit 1)
          echo "Pack-test OK"

  starters:
    name: Starter E2E (${{ matrix.framework }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.templates == 'true'
      || needs.changes.outputs.src == 'true'
      || needs.changes.outputs.starters == 'true'
      || needs.changes.outputs.deps == 'true'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || github.head_ref == 'changeset-release/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.starter_matrix) }}
    steps:
      - name: Checkout kigumi-cli
        uses: actions/checkout@v7
        with:
          path: kigumi-cli

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: kigumi-cli/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kigumi-cli/pnpm-lock.yaml

      - name: Install kigumi-cli deps
        working-directory: kigumi-cli
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        working-directory: kigumi-cli
        run: pnpm run build

      - name: Pack CLI
        id: pack
        working-directory: kigumi-cli
        run: |
          set -euo pipefail
          TARBALL=$(pnpm pack | tail -1)
          echo "tarball=${GITHUB_WORKSPACE}/kigumi-cli/${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Checkout starter
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ vars[format('STARTER_{0}_REF', matrix.framework_upper)] }}
          path: starter
          fetch-depth: 1

      - name: Install starter deps
        working-directory: starter
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install kigumi tarball
        working-directory: starter
        run: pnpm add -D "file:${{ steps.pack.outputs.tarball }}" --ignore-workspace

      - name: Add components
        working-directory: starter
        run: pnpm exec kigumi add button input select dialog card badge switch textarea tooltip --force --yes

      - name: Snapshot diff
        working-directory: kigumi-cli
        env:
          KIGUMI_STARTER: ${{ matrix.framework }}
          KIGUMI_STARTER_DIR: ${{ github.workspace }}/starter
        run: pnpm run test:starters

      - name: Starter typecheck
        working-directory: starter
        run: pnpm run typecheck

      - name: Starter build
        working-directory: starter
        run: pnpm run build

  docs-typecheck:
    name: Type-check docs
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.actor != 'dependabot[bot]'
      && (
        needs.changes.outputs.docs == 'true'
        || needs.changes.outputs.src == 'true'
        || needs.changes.outputs.templates == 'true'
        || needs.changes.outputs.deps == 'true'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || github.head_ref == 'changeset-release/main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The docs site depends on the paid Web Awesome Pro package. Pull requests
      # from forks do not receive repository secrets, so the install below would
      # hit Cloudsmith with an empty token and fail with a 401 on an ordinary
      # contribution. Detect that up front and skip the docs steps instead.
      - name: Check Pro registry access
        id: pro
        env:
          WA_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          if [ -n "$WA_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping docs type-check: no Web Awesome Pro token (expected for pull requests from forks)."
          fi

      - name: Configure Pro registry for docs
        if: steps.pro.outputs.available == 'true'
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        if: steps.pro.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        if: steps.pro.outputs.available == 'true'
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Type-check docs
        if: steps.pro.outputs.available == 'true'
        working-directory: docs
        run: pnpm exec tsc -p tsconfig.app.json

  story-interactions:
    name: Story Interactions (Storybook Vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.actor != 'dependabot[bot]'
      && (
        needs.changes.outputs.story == 'true'
        || needs.changes.outputs.deps == 'true'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || github.head_ref == 'changeset-release/main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Fork pull requests do not receive secrets, so the Pro install below
      # would fail with a 401. Skip the docs-dependent steps instead.
      - name: Check Pro registry access
        id: pro
        env:
          WA_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          if [ -n "$WA_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Storybook interaction tests: no Web Awesome Pro token (expected for pull requests from forks)."
          fi

      - name: Configure Pro registry for docs
        if: steps.pro.outputs.available == 'true'
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        if: steps.pro.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        if: steps.pro.outputs.available == 'true'
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # This cache never hits, and cannot as written. GitHub scopes a cache
      # written on a PR branch to that PR's ref, and only caches on the default
      # branch are visible to other branches. This workflow triggers solely on
      # `pull_request`, so every save lands on refs/pull/<n>/merge and the next
      # PR starts cold: "Cache not found for input keys" on every observed run,
      # including the fallback restore-key, while the 249 MB browser download
      # repeats each time.
      #
      # Kept rather than deleted because it costs nothing while wrong and starts
      # working the moment this workflow also runs on pushes to main, which is
      # the actual fix. Tracked separately; not bundled here to keep the
      # mirror-dependency removal reviewable on its own.
      - name: Cache Playwright browsers
        if: steps.pro.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright Chromium
        if: steps.pro.outputs.available == 'true'
        working-directory: docs
        # No --with-deps: it shells out to apt against Google's Debian mirror,
        # and when that mirror serves a bad index the job dies before running a
        # single test (it did, repeatedly, on the 1.0.0 release PR). Measured on
        # a passing run, apt reported 24 of its 33 packages already "set to
        # manually installed" on the runner image; the 9 it genuinely installed
        # were all fonts (CJK, Thai, Cyrillic, X11 font utils), none of them a
        # Chromium runtime library. This lane runs interaction tests on
        # Latin-only stories and compares no pixels, so those fonts buy nothing
        # here -- Chromatic owns visual regression and runs elsewhere.
        run: pnpm exec playwright install chromium

      - name: Run story interactions
        if: steps.pro.outputs.available == 'true'
        working-directory: docs
        run: pnpm storybook:test

  chromatic:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect visual changes
        id: visual-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            visual:
              - 'docs/src/stories/**'
              - 'docs/src/components/**'
              - 'docs/.storybook/**'

      # Building the Storybook needs the paid Web Awesome Pro package, and
      # Chromatic needs its own token. Fork pull requests have neither, so the
      # visual job would fail on an ordinary contribution. Skip it instead.
      - name: Check visual-regression credentials
        id: pro
        env:
          WA_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
          CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$WA_TOKEN" ] && [ -n "$CHROMATIC_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping visual regression: missing Web Awesome Pro or Chromatic token (expected for pull requests from forks)."
          fi

      - name: Setup pnpm
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pro registry for docs
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        working-directory: docs
        run: pnpm build-storybook --stats-json

      - name: Run Chromatic
        if: steps.pro.outputs.available == 'true' && (steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test'))
        uses: chromaui/action@latest
        with:
          workingDir: docs
          storybookBuildDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
