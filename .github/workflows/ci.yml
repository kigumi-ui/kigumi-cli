name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      src: ${{ steps.filter.outputs.src }}
      templates: ${{ steps.filter.outputs.templates }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
      starters: ${{ steps.filter.outputs.starters }}
      story: ${{ steps.filter.outputs.story }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
            docs:
              - 'docs/**'
            src:
              - 'src/**'
            templates:
              - 'templates/**'
            integration:
              - 'tests/integration/**'
            e2e:
              - 'tests/e2e/**'
            starters:
              - 'tests/fixtures/starter-snapshots/**'
              - 'tests/e2e/starter-snapshots.test.ts'
            story:
              - 'docs/src/stories/**'
              - 'docs/src/components/**'
              - 'docs/.storybook/**'

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: TypeScript strict check
        run: pnpm run type-check

      - name: Check mock budget
        env:
          MOCK_BUDGET_ENFORCE: '1'
        run: pnpm run check:mocks

      - name: Validate Registry
        run: pnpm run validate:registry

      - name: Validate Templates
        run: pnpm run validate:templates

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

      - name: Build
        run: pnpm run build

  integration:
    name: Integration Tests (${{ matrix.framework }}@${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true'
      || needs.changes.outputs.templates == 'true'
      || needs.changes.outputs.integration == 'true'
      || needs.changes.outputs.deps == 'true'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || github.head_ref == 'changeset-release/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: react, version: '18' }
          - { framework: react, version: '19' }
          - { framework: vue, version: '3' }
          - { framework: angular, version: 'latest' }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: Integration tests
        run: pnpm run test:integration
        env:
          REACT_VERSION: ${{ matrix.framework == 'react' && matrix.version || '18' }}
          KIGUMI_MATRIX_FRAMEWORK: ${{ matrix.framework }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true'
      || needs.changes.outputs.templates == 'true'
      || needs.changes.outputs.e2e == 'true'
      || needs.changes.outputs.deps == 'true'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || github.head_ref == 'changeset-release/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: E2E tests
        run: pnpm run test:e2e

  pack-test:
    name: Pack Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack and smoke install
        run: |
          set -euo pipefail
          TARBALL=$(pnpm pack | tail -1)
          echo "Built tarball: ${TARBALL}"
          SMOKE_DIR="${RUNNER_TEMP}/kigumi-pack-test"
          mkdir -p "${SMOKE_DIR}/src"
          cd "${SMOKE_DIR}"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "file:${GITHUB_WORKSPACE}/${TARBALL}"
          # Explicit --components-dir pins the assertion path independent of
          # kigumi's sourceLayout detection (which requires more than just an
          # empty src/ dir to default to src/components/ui).
          npx --no-install kigumi init --framework react --typescript --yes --no-install --components-dir src/components/ui
          npx --no-install kigumi add button --yes
          test -f src/components/ui/Button/Button.tsx \
            || (echo "ERROR: Button wrapper missing at src/components/ui/Button/Button.tsx"; ls -R src 2>/dev/null || true; exit 1)
          echo "Pack-test OK"

  starters:
    name: Starter E2E (${{ matrix.framework }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.templates == 'true'
      || needs.changes.outputs.src == 'true'
      || needs.changes.outputs.starters == 'true'
      || needs.changes.outputs.deps == 'true'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || github.head_ref == 'changeset-release/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: react
            framework_upper: REACT
            repo: kigumi-ui/kigumi-react-starter
          - framework: vue
            framework_upper: VUE
            repo: kigumi-ui/kigumi-vue-starter
          - framework: angular
            framework_upper: ANGULAR
            repo: kigumi-ui/kigumi-angular-starter
          - framework: next
            framework_upper: NEXT
            repo: kigumi-ui/kigumi-next-starter
    steps:
      - name: Checkout kigumi-cli
        uses: actions/checkout@v6
        with:
          path: kigumi-cli

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: kigumi-cli/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: kigumi-cli/pnpm-lock.yaml

      - name: Install kigumi-cli deps
        working-directory: kigumi-cli
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        working-directory: kigumi-cli
        run: pnpm run build

      - name: Pack CLI
        id: pack
        working-directory: kigumi-cli
        run: |
          set -euo pipefail
          TARBALL=$(pnpm pack | tail -1)
          echo "tarball=${GITHUB_WORKSPACE}/kigumi-cli/${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Checkout starter
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ vars[format('STARTER_{0}_REF', matrix.framework_upper)] }}
          path: starter
          fetch-depth: 1

      - name: Install starter deps
        working-directory: starter
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install kigumi tarball
        working-directory: starter
        run: pnpm add -D "file:${{ steps.pack.outputs.tarball }}" --ignore-workspace

      - name: Add components
        working-directory: starter
        run: pnpm exec kigumi add button input select dialog card badge switch textarea tooltip --force --yes

      - name: Snapshot diff
        working-directory: kigumi-cli
        env:
          KIGUMI_STARTER: ${{ matrix.framework }}
          KIGUMI_STARTER_DIR: ${{ github.workspace }}/starter
        run: pnpm run test:starters

      - name: Starter typecheck
        working-directory: starter
        run: pnpm run typecheck

      - name: Starter build
        working-directory: starter
        run: pnpm run build

  docs-typecheck:
    name: Type-check docs
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.actor != 'dependabot[bot]'
      && (
        needs.changes.outputs.docs == 'true'
        || needs.changes.outputs.src == 'true'
        || needs.changes.outputs.templates == 'true'
        || needs.changes.outputs.deps == 'true'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || github.head_ref == 'changeset-release/main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pro registry for docs
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Type-check docs
        working-directory: docs
        run: pnpm exec tsc -p tsconfig.app.json

  story-interactions:
    name: Story Interactions (Storybook Vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.actor != 'dependabot[bot]'
      && (
        needs.changes.outputs.story == 'true'
        || needs.changes.outputs.deps == 'true'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || github.head_ref == 'changeset-release/main'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pro registry for docs
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright Chromium
        working-directory: docs
        run: pnpm exec playwright install --with-deps chromium

      - name: Run story interactions
        working-directory: docs
        run: pnpm storybook:test

  chromatic:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect visual changes
        id: visual-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            visual:
              - 'docs/src/stories/**'
              - 'docs/src/components/**'
              - 'docs/.storybook/**'

      - name: Setup pnpm
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pro registry for docs
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        run: |
          printf '@awesome.me:registry=https://npm.cloudsmith.io/fortawesome/webawesome-pro/\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=%s\n//npm.cloudsmith.io/fortawesome/webawesome-pro/:always-auth=true\n' "${{ secrets.WEBAWESOME_NPM_TOKEN }}" > docs/.npmrc

      - name: Install root dependencies
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        working-directory: docs
        run: pnpm build-storybook --stats-json

      - name: Run Chromatic
        if: steps.visual-filter.outputs.visual == 'true' || contains(github.event.pull_request.labels.*.name, 'visual-test')
        uses: chromaui/action@latest
        with:
          workingDir: docs
          storybookBuildDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
