name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Check coverage thresholds
        run: |
          # Extract coverage percentages from JSON report
          STATEMENTS=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.statements.pct")
          BRANCHES=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.branches.pct")
          FUNCTIONS=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.functions.pct")
          LINES=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct")
          
          # Phase 1: 50% minimum (current baseline)
          MIN_COVERAGE=50
          
          echo "Coverage Report:"
          echo "  Statements: ${STATEMENTS}%"
          echo "  Branches:   ${BRANCHES}%"
          echo "  Functions:  ${FUNCTIONS}%"
          echo "  Lines:      ${LINES}%"
          echo ""
          echo "Minimum Required: ${MIN_COVERAGE}%"
          
          # Check if any metric is below threshold
          if (( $(echo "$STATEMENTS < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Statement coverage ${STATEMENTS}% is below ${MIN_COVERAGE}%"
            exit 1
          fi
          if (( $(echo "$BRANCHES < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Branch coverage ${BRANCHES}% is below ${MIN_COVERAGE}%"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Function coverage ${FUNCTIONS}% is below ${MIN_COVERAGE}%"
            exit 1
          fi
          if (( $(echo "$LINES < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Line coverage ${LINES}% is below ${MIN_COVERAGE}%"
            exit 1
          fi
          
          echo "✅ All coverage metrics meet the minimum threshold"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: npx tsc --noEmit

  validate:
    name: Validate Registry & Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Registry
        run: pnpm run validate:registry

      - name: Validate Templates
        run: pnpm run validate:templates

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
