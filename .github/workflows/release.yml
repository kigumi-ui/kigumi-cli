name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      chromatic-skip: true
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci]
    if: needs.ci.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke test (packed install)
        run: |
          set -euo pipefail
          TARBALL=$(pnpm pack | tail -1)
          echo "Built tarball: ${TARBALL}"
          SMOKE_DIR="${RUNNER_TEMP}/kigumi-release-smoke"
          mkdir -p "${SMOKE_DIR}/src"
          cd "${SMOKE_DIR}"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "file:${GITHUB_WORKSPACE}/${TARBALL}"
          # Explicit --components-dir pins the assertion path independent of
          # kigumi's sourceLayout detection (which requires more than just an
          # empty src/ dir to default to src/components/ui).
          npx --no-install kigumi init --framework react --typescript --yes --no-install --components-dir src/components/ui
          npx --no-install kigumi add button --yes
          test -f src/components/ui/Button/Button.tsx \
            || (echo "ERROR: Button wrapper missing at src/components/ui/Button/Button.tsx"; ls -R src 2>/dev/null || true; exit 1)
          echo "Release smoke OK"

      - name: Verify package contents
        run: pnpm pack --dry-run 2>&1 | head -50

      - name: Version and Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
          createGithubReleases: true
          commit: "chore(release): bump version"
          title: "chore(release): bump version"
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
