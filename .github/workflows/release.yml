name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Would let npm attach a provenance attestation, but npm only verifies
      # provenance for public source repos; this repo is private, so
      # publishing stays unsigned until that changes.
      id-token: write
    steps:
      - name: Checkout
        # Check out with the default GITHUB_TOKEN (not the PAT): it always has
        # access to its own private repo, so checkout is never the failure
        # point, and the changesets push uses these persisted credentials. The
        # PAT is needed only for PR creation; the pre-flight step below
        # validates it early with an actionable message.
        uses: actions/checkout@v7

      - name: Verify release token can read + write the repo
        # Fail fast with an actionable message instead of dying deep inside
        # changesets/action with "not all refs are readable" when the PAT is
        # expired, rotated, or missing the pull-requests scope.
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}" --jq '.permissions' > /tmp/perms.json 2> /tmp/err; then
            echo "::error::PERSONAL_GITHUB_TOKEN cannot read ${{ github.repository }}. Renew the PAT (classic: repo scope; fine-grained: Contents R/W + Pull requests R/W + this repo in scope)."
            cat /tmp/err || true
            exit 1
          fi
          if [ "$(gh api "repos/${{ github.repository }}" --jq '.permissions.push')" != "true" ]; then
            echo "::error::PERSONAL_GITHUB_TOKEN lacks write access to ${{ github.repository }} (needed to push changeset-release/main and open the version PR)."
            exit 1
          fi
          echo "Release token OK (read + write confirmed)."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke test (packed install)
        run: |
          set -euo pipefail
          # Pack into RUNNER_TEMP, never the workspace: a stray *.tgz in the
          # repo root gets swept into the release commit by changesets/action's
          # `git add .`. --pack-destination prints the absolute tarball path.
          TARBALL=$(pnpm pack --pack-destination "${RUNNER_TEMP}" | tail -1)
          echo "Built tarball: ${TARBALL}"
          SMOKE_DIR="${RUNNER_TEMP}/kigumi-release-smoke"
          mkdir -p "${SMOKE_DIR}/src"
          cd "${SMOKE_DIR}"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "file:${TARBALL}"
          # Explicit --components-dir pins the assertion path independent of
          # kigumi's sourceLayout detection (which requires more than just an
          # empty src/ dir to default to src/components/ui).
          npx --no-install kigumi init --framework react --typescript --yes --no-install --components-dir src/components/ui
          npx --no-install kigumi add button --yes
          test -f src/components/ui/Button/Button.tsx \
            || (echo "ERROR: Button wrapper missing at src/components/ui/Button/Button.tsx"; ls -R src 2>/dev/null || true; exit 1)
          echo "Release smoke OK"

      - name: Verify package contents
        run: pnpm pack --dry-run 2>&1 | head -50

      - name: Authenticate with npm
        # changesets/action v1 wrote this file itself from the NPM_TOKEN env
        # var; v2 removed that, so the registry credential has to exist before
        # `changeset publish` runs. Written to $HOME rather than the workspace
        # so it cannot be swept into the release commit by the action's
        # `git add .`.
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty. Publishing would run unauthenticated."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
          npm whoami > /dev/null 2>&1 \
            || (echo "::error::NPM_TOKEN is set but npm rejected it (expired or revoked?)."; exit 1)
          echo "npm authentication OK."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version and Publish
        id: changesets
        # v2 renamed every input this step uses and dropped its own NPM_TOKEN
        # handling. Unknown `with:` keys are ignored silently by Actions, so a
        # v1-shaped call against v2 does not fail the job -- it just stops
        # creating the version PR and publishes unauthenticated. The .npmrc
        # step above is what replaces the removed token handling.
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm release
          create-github-releases: true
          commit-message: "chore(release): bump version"
          pr-title: "chore(release): bump version"
          # v1 took this from the GITHUB_TOKEN env var; v2 requires it as an
          # explicit input. Still the PAT, because the default token cannot
          # open the version PR.
          github-token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
